<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十夜导航 | 管理后台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
        :root {
            --neon-blue: #00f3ff;
            --theme-color: var(--neon-blue);
            --theme-color-rgb: 0, 243, 255;
            --glass-opacity: 0.6;
        }
        body { 
            background: #050510; 
            color: #fff; 
            font-family: sans-serif; 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
        }

        .theme-text { color: var(--theme-color); }
        .theme-bg { background-color: var(--theme-color); }
        .theme-border { border-color: var(--theme-color); }
        .theme-glow { box-shadow: 0 0 15px rgba(var(--theme-color-rgb), 0.5); }
        .site-title-themed {
            color: var(--theme-color);
            text-shadow: 0 0 20px rgba(var(--theme-color-rgb), 0.4);
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            z-index: 1000;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.2;
        }

        .glass { background: rgba(10, 10, 20, var(--glass-opacity)); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .btn-neon { background: var(--theme-color); color: #000; font-weight: bold; transition: all 0.3s; }
        .btn-neon:hover { box-shadow: 0 0 20px var(--theme-color); transform: scale(1.02); }
        
        .input-dark {
            background: rgba(0, 0, 0, calc(var(--glass-opacity) * 0.7));
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.75rem;
            border-radius: 0.5rem;
            width: 100%;
            transition: all 0.3s;
        }
        .input-dark:focus {
            outline: none;
            border-color: var(--theme-color);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 10px rgba(var(--theme-color-rgb), 0.2);
        }
    </style>
</head>
<body id="admin-body" class="relative">
    <div id="bg-overlay" class="fixed inset-0 bg-black z-[-1]" style="opacity: 0.5;"></div>
    
    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 flex items-center justify-center z-50">
        <div id="login-bg" class="absolute inset-0 bg-black opacity-80 transition-opacity"></div>
        <div class="glass p-10 rounded-2xl w-full max-w-md border-t-4 theme-border relative z-10">
                <h1 id="login-title" class="orbitron text-3xl font-bold site-title-themed mb-2 text-center tracking-tighter">身份验证</h1>
                <p class="text-gray-500 text-[10px] orbitron mb-8 text-center tracking-[0.2em]">ACCESS CLOUD CONSOLE</p>
                <input type="text" id="username-input" placeholder="ADMIN USER" class="input-dark orbitron text-center mb-4">
                <input type="password" id="password-input" placeholder="PASSKEY" class="input-dark orbitron text-center mb-6">
                <button onclick="login()" class="w-full btn-neon py-4 rounded-lg orbitron tracking-widest theme-glow">INITIALIZE_CONNECTION</button>
            <p id="login-error" class="text-red-500 text-[10px] orbitron mt-6 text-center hidden uppercase tracking-widest"></p>
        </div>
    </div>

    <!-- Main Content -->
    <div id="admin-content" class="hidden container mx-auto max-w-6xl px-4 py-12">
        <header class="flex flex-col md:flex-row justify-between items-end mb-12 border-b border-white/5 pb-8">
            <div>
                <h1 class="orbitron text-4xl font-bold tracking-tighter site-title-themed mb-1 uppercase">十夜导航.管理后台</h1>
                <p class="text-[10px] text-gray-500 orbitron tracking-[0.4em] uppercase">控制与数据管理子系统 v1.2</p>
            </div>
            <div class="flex items-center space-x-6 mt-6 md:mt-0">
                <a href="/" target="_blank" class="text-[10px] orbitron tracking-[0.2em] theme-text hover:text-white transition-colors border-b theme-border/20 pb-1">预览前台</a>
                <button onclick="logout()" class="text-[10px] orbitron tracking-[0.2em] text-red-400 hover:text-red-300 transition-colors">退出登录</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
            <!-- Sidebar -->
            <div class="lg:col-span-4 space-y-8">
                <div class="glass p-8 rounded-2xl relative overflow-hidden">
                    <div class="absolute top-0 right-0 p-2 opacity-5">
                        <i data-lucide="settings" class="w-20 h-20"></i>
                    </div>
                    <h2 class="text-[11px] font-bold uppercase tracking-[0.3em] theme-text mb-6 flex items-center">
                        <span class="w-2 h-2 theme-bg mr-3 animate-pulse"></span>
                        系统全局设置
                    </h2>
                    <div class="space-y-5">
                        <div>
                            <label class="block text-[10px] text-gray-500 mb-2 orbitron uppercase tracking-widest">站点名称</label>
                            <input type="text" id="site-name-input" class="input-dark text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 mb-2 orbitron uppercase tracking-widest">主色调 (HEX)</label>
                            <div class="flex space-x-2">
                                <input type="text" id="theme-color-input" class="input-dark text-xs mono">
                                <input type="color" id="theme-color-picker" class="w-12 h-10 bg-transparent border-none p-0 cursor-pointer" oninput="document.getElementById('theme-color-input').value = this.value">
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 mb-2 orbitron uppercase tracking-widest">背景图 URL</label>
                            <input type="text" id="bg-url-input" class="input-dark text-xs">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 mb-2 flex justify-between orbitron uppercase tracking-widest">
                                <span>背景遮罩透明度</span>
                                <span id="opacity-value" class="theme-text">0.4</span>
                            </label>
                            <input type="range" id="bg-opacity-input" min="0" max="1" step="0.05" oninput="document.getElementById('opacity-value').innerText = this.value" class="w-full h-1 bg-white/5 rounded-lg appearance-none cursor-pointer" style="accent-color: var(--theme-color)">
                        </div>
                        <div>
                            <label class="block text-[10px] text-gray-500 mb-2 flex justify-between orbitron uppercase tracking-widest">
                                <span>卡片磨砂透明度</span>
                                <span id="card-opacity-value" class="theme-text">0.6</span>
                            </label>
                            <input type="range" id="card-opacity-input" min="0" max="1" step="0.05" oninput="document.getElementById('card-opacity-value').innerText = this.value" class="w-full h-1 bg-white/5 rounded-lg appearance-none cursor-pointer" style="accent-color: var(--theme-color)">
                        </div>
                        <div class="pt-4 border-t border-white/5 space-y-4">
                            <h3 class="text-[9px] orbitron text-gray-500 tracking-widest uppercase">账户凭据管理</h3>
                            <div>
                                <label class="block text-[9px] text-gray-600 mb-1 uppercase">管理用户名</label>
                                <input type="text" id="admin-user-input" class="input-dark text-xs py-2">
                            </div>
                            <div>
                                <label class="block text-[9px] text-gray-600 mb-1 uppercase">修改密码</label>
                                <input type="password" id="admin-pass-input" placeholder="留空则不修改" class="input-dark text-xs py-2">
                            </div>
                        </div>
                        <button onclick="updateSettings()" class="w-full btn-neon py-3 rounded text-[11px] orbitron tracking-widest transition">提交系统更改</button>
                    </div>
                </div>

                <div class="glass p-8 rounded-2xl">
                    <h2 class="text-[11px] font-bold uppercase tracking-[0.3em] theme-text mb-6 flex items-center">
                        <span class="w-2 h-2 theme-bg mr-3"></span>
                        新建部署分类
                    </h2>
                    <label class="block text-[10px] text-gray-500 mb-2 orbitron uppercase tracking-widest">分类识别名</label>
                    <input type="text" id="cat-name-input" placeholder="例如：常用工具" class="input-dark text-xs mb-4 uppercase">
                    <button onclick="addCategory()" class="w-full bg-white/5 border border-white/10 hover:theme-border/50 hover:bg-white/5 py-3 rounded text-[11px] orbitron tracking-widest transition">生成分类</button>
                </div>
            </div>

            <!-- Content Area -->
            <div class="lg:col-span-8">
                <div id="categories-list" class="space-y-10">
                    <!-- Loading state -->
                    <div class="text-center py-20 orbitron text-gray-600 animate-pulse tracking-widest">CONNECTING_TO_D1_STREAMS...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div id="link-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-40 p-4 backdrop-blur-md">
        <div class="glass p-10 rounded-2xl w-full max-w-xl border-t-4 theme-border relative overflow-hidden">
            <div class="absolute -top-10 -right-10 p-4 opacity-[0.03] pointer-events-none rotate-12">
                <i data-lucide="layout" class="w-64 h-64"></i>
            </div>
            <h2 id="modal-title" class="orbitron text-2xl font-bold theme-text mb-2 uppercase tracking-tighter">DATA UNIT EDITOR</h2>
            <p class="text-[10px] text-gray-500 orbitron mb-8 tracking-[0.3em]">MODIFIED_CLOUD_STREAM_SEGMENT</p>
            
            <div class="space-y-6 relative z-10">
                <input type="hidden" id="link-id">
                <input type="hidden" id="link-cat-id">
                <div>
                    <label class="block text-[10px] text-gray-500 mb-2 orbitron tracking-widest">单元名称</label>
                    <input type="text" id="link-title" class="input-dark">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 mb-2 orbitron tracking-widest">链接地址 (URL)</label>
                    <input type="text" id="link-url" class="input-dark mono text-xs">
                </div>
                <div>
                    <label class="block text-[10px] text-gray-500 mb-1 orbitron tracking-widest flex justify-between">
                        <span>图标资源</span>
                        <span class="text-[8px] theme-text/50">留空则自动抓取图标</span>
                    </label>
                    <input type="text" id="link-icon" class="input-dark mono text-xs">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] text-gray-500 mb-2 orbitron tracking-widest">排序权重</label>
                        <input type="number" id="link-order" value="0" class="input-dark">
                    </div>
                </div>
                
                <div class="flex space-x-4 mt-10">
                    <button onclick="saveLink()" class="flex-grow btn-neon py-4 rounded-lg orbitron tracking-widest theme-glow">提交保存</button>
                    <button onclick="closeModal()" class="bg-white/5 border border-white/10 hover:theme-border/40 hover:theme-text px-6 py-4 rounded-lg orbitron tracking-widest text-[11px] transition-all">中止</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        let currentToken = localStorage.getItem('neon_token');

        document.addEventListener('DOMContentLoaded', async () => {
            // Apply background before everything else
            await fetchSystemConfig();
            
            if (currentToken) {
                showAdmin();
            }
            lucide.createIcons();
        });

        // Apply configurations to UI
        function applyConfig(config) {
            if (config.themeColor) {
                const hex = config.themeColor.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                document.documentElement.style.setProperty('--theme-color', config.themeColor);
                document.documentElement.style.setProperty('--theme-color-rgb', `${r}, ${g}, ${b}`);
            }

            if (config.backgroundUrl) {
                document.body.style.backgroundImage = `url('${config.backgroundUrl}')`;
            }

            const bgOp = config.backgroundOpacity !== undefined ? parseFloat(config.backgroundOpacity) : 0.4;
            document.getElementById('bg-overlay').style.opacity = bgOp;
            
            // Login backdrop
            const loginBg = document.getElementById('login-bg');
            if (loginBg) loginBg.style.opacity = bgOp;

            const cardOp = config.cardOpacity !== undefined ? parseFloat(config.cardOpacity) : 0.6;
            document.documentElement.style.setProperty('--glass-opacity', cardOp);

            if (config.siteName) {
                document.title = config.siteName + " - 管理后台";
                const loginTitle = document.getElementById('login-title');
                if (loginTitle) {
                    loginTitle.innerText = config.siteName;
                    loginTitle.classList.add('site-title-themed');
                }
                const mainTitle = document.querySelector('h1.orbitron.text-4xl');
                if (mainTitle) {
                    mainTitle.innerHTML = config.siteName + '.管理后台';
                    mainTitle.classList.add('site-title-themed');
                }
            }

            // Sync form inputs if they exist (logged in)
            const siteInput = document.getElementById('site-name-input');
            if (siteInput) {
                siteInput.value = config.siteName || '';
                document.getElementById('theme-color-input').value = config.themeColor || '#00f3ff';
                document.getElementById('theme-color-picker').value = config.themeColor || '#00f3ff';
                document.getElementById('bg-url-input').value = config.backgroundUrl || '';
                document.getElementById('bg-opacity-input').value = bgOp;
                document.getElementById('opacity-value').innerText = bgOp;
                document.getElementById('card-opacity-input').value = cardOp;
                document.getElementById('card-opacity-value').innerText = cardOp;
                document.getElementById('admin-user-input').value = config.adminUsername || '';
            }
        }

        async function fetchSystemConfig() {
            try {
                const res = await fetch('/api/config');
                const config = await res.json();
                window.currentConfig = config;
                applyConfig(config);
            } catch (e) {
                console.error("Initial config load failed", e);
            }
        }

        async function login() {
            const username = document.getElementById('username-input').value;
            const password = document.getElementById('password-input').value;
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) {
                currentToken = data.token;
                localStorage.setItem('neon_token', currentToken);
                showAdmin();
                // Ensure config is applied to the newly visible UI
                if (window.currentConfig) applyConfig(window.currentConfig);
            } else {
                const errorEl = document.getElementById('login-error');
                errorEl.innerText = data.message || "AUTHENTICATION FAILURE";
                errorEl.classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('neon_token');
            window.location.reload();
        }

        function showAdmin() {
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('admin-content').classList.remove('hidden');
            loadData();
        }

        async function loadData() {
            try {
                const res = await fetch('/api/links');
                const data = await res.json();
                
                // Config already applied by fetchSystemConfig, but we refresh the inputs here
                await fetchSystemConfig();

                renderAdminList(data);
            } catch (e) {
                console.error(e);
            }
        }

        function renderAdminList(categories) {
            const container = document.getElementById('categories-list');
            container.innerHTML = '';

            if (categories.length === 0) {
                container.innerHTML = `<div class="glass p-12 text-center orbitron text-gray-600 tracking-widest text-xs uppercase">未检测到活动数据段</div>`;
                return;
            }

            categories.forEach(cat => {
                const catDiv = document.createElement('div');
                catDiv.className = 'glass rounded-2xl overflow-hidden';
                
                catDiv.innerHTML = `
                    <div class="bg-white/5 px-8 py-4 flex justify-between items-center border-b border-white/5">
                        <div class="flex items-center space-x-4">
                            <span class="w-1 h-4 theme-bg theme-glow"></span>
                            <input type="text" value="${cat.name}" onchange="updateCat(${cat.id}, this.value, ${cat.order_index})" class="bg-transparent border-none text-sm font-bold orbitron text-white focus:outline-none focus:theme-text w-48 uppercase">
                            <span class="text-[9px] text-gray-600 orbitron">排序:</span>
                            <input type="number" value="${cat.order_index}" onchange="updateCat(${cat.id}, '${cat.name}', this.value)" class="bg-black/40 border border-white/10 text-[10px] theme-text px-2 py-1 rounded w-16 focus:outline-none">
                        </div>
                        <div class="flex items-center space-x-6">
                            <button onclick="openLinkModal(${cat.id})" class="text-[10px] orbitron tracking-widest theme-text hover:text-white transition-colors">添加链接</button>
                            <button onclick="deleteCat(${cat.id})" class="text-[10px] orbitron tracking-widest text-gray-600 hover:text-red-500 transition-colors">清理分类</button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4" id="grid-${cat.id}"></div>
                    </div>
                `;

                const linksGrid = catDiv.querySelector(`#grid-${cat.id}`);

                cat.links.forEach(link => {
                    const lDiv = document.createElement('div');
                    lDiv.className = 'bg-black/40 border border-white/5 p-4 rounded-xl flex items-center justify-between group hover:theme-border/30 transition-all';
                    lDiv.innerHTML = `
                        <div class="flex items-center space-x-4 overflow-hidden">
                            <div class="w-10 h-10 rounded-lg bg-black/60 flex items-center justify-center overflow-hidden border border-white/5">
                                <img src="${link.icon || 'https://www.google.com/s2/favicons?sz=64&domain=' + new URL(link.url).hostname}" class="w-6 h-6 object-contain" onerror="this.src='/favicon.ico'">
                            </div>
                            <div class="truncate">
                                <p class="text-xs font-bold orbitron text-gray-200 group-hover:text-white truncate">${link.title}</p>
                                <p class="text-[9px] mono text-gray-600 truncate mt-1">${link.url}</p>
                            </div>
                        </div>
                        <div class="flex space-x-3 opacity-0 group-hover:opacity-100 transition">
                            <button onclick='editLink(${JSON.stringify(link).replace(/'/g, "&#39;")})' class="text-[9px] orbitron theme-text hover:scale-110 transition">编辑</button>
                            <button onclick="deleteLink(${link.id})" class="text-[9px] orbitron text-red-400 hover:scale-110 transition">删除</button>
                        </div>
                    `;
                    linksGrid.appendChild(lDiv);
                });

                if (cat.links.length === 0) {
                    linksGrid.innerHTML = `<div class="col-span-full py-6 text-center text-[9px] orbitron text-gray-700 tracking-widest uppercase">暂无链接单元</div>`;
                }

                container.appendChild(catDiv);
            });
            lucide.createIcons();
        }

        async function api(type, action, data) {
            const res = await fetch('/api/links', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type, action, token: currentToken, data })
            });
            if (res.status === 401) logout();
            loadData();
        }

        function addCategory() {
            const name = document.getElementById('cat-name-input').value;
            if (!name) return;
            api('category', 'add', { name });
            document.getElementById('cat-name-input').value = '';
        }

        function updateCat(id, name, order_index) {
            api('category', 'update', { id, name, order_index });
        }

        function deleteCat(id) {
            if (confirm("确认清理该分类？包含的所有链接都将被删除。")) {
                api('category', 'delete', { id });
            }
        }

        function openLinkModal(catId) {
            document.getElementById('link-modal').style.display = 'flex';
            document.getElementById('link-cat-id').value = catId;
            document.getElementById('link-id').value = '';
            document.getElementById('link-title').value = '';
            document.getElementById('link-url').value = '';
            document.getElementById('link-icon').value = '';
            document.getElementById('link-order').value = '0';
        }

        function editLink(link) {
            document.getElementById('link-modal').style.display = 'flex';
            document.getElementById('link-id').value = link.id;
            document.getElementById('link-cat-id').value = link.category_id;
            document.getElementById('link-title').value = link.title;
            document.getElementById('link-url').value = link.url;
            document.getElementById('link-icon').value = link.icon || '';
            document.getElementById('link-order').value = link.order_index;
        }

        function closeModal() {
            document.getElementById('link-modal').style.display = 'none';
        }

        function saveLink() {
            const data = {
                id: document.getElementById('link-id').value,
                category_id: document.getElementById('link-cat-id').value,
                title: document.getElementById('link-title').value,
                url: document.getElementById('link-url').value,
                icon: document.getElementById('link-icon').value,
                order_index: parseInt(document.getElementById('link-order').value) || 0
            };
            const action = data.id ? 'update' : 'add';
            api('link', action, data);
            closeModal();
        }

        function deleteLink(id) {
            if (confirm("确认删除该链接数据？")) {
                api('link', 'delete', { id });
            }
        }

        async function updateSettings() {
            const config = {
                backgroundUrl: document.getElementById('bg-url-input').value,
                backgroundOpacity: document.getElementById('bg-opacity-input').value,
                cardOpacity: document.getElementById('card-opacity-input').value,
                siteName: document.getElementById('site-name-input').value,
                themeColor: document.getElementById('theme-color-input').value,
                adminUsername: document.getElementById('admin-user-input').value,
                adminPassword: document.getElementById('admin-pass-input').value,
                token: currentToken
            };

            const res = await fetch('/api/config', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(config)
            });

            if (res.ok) {
                applyConfig(config);
                alert("系统配置已更新");
                if (config.adminPassword) {
                    alert("检测到密码更改，请重新登录");
                    logout();
                }
            }
        }
    </script>
</body>
</html>
