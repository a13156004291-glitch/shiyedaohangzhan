<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十夜导航系统 | 极简赛博导航</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap');

        :root {
            --neon-blue: #00f3ff;
            --neon-pink: #ff00ff;
            --theme-color: var(--neon-blue);
            --theme-color-rgb: 0, 243, 255;
            --glass-opacity: 0.6;
            --bg-opacity: 0.4;
            --glass-bg: rgba(10, 10, 20, var(--glass-opacity));
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow: 0 0 10px rgba(var(--theme-color-rgb), 0.5);
        }

        .theme-text { color: var(--theme-color); }
        .theme-bg { background-color: var(--theme-color); }
        .theme-border { border-color: var(--theme-color); }
        .theme-glow { box-shadow: 0 0 15px rgba(var(--theme-color-rgb), 0.5); }
        .theme-glow-text { text-shadow: 0 0 10px rgba(var(--theme-color-rgb), 0.5); }

        body {
            background-color: #050510;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Noto Sans SC', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: default;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 1000;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
        }

        .neon-glow {
            box-shadow: var(--glow);
        }

        .link-card {
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .link-card:hover {
            transform: translateY(-6px) scale(1.03);
            background: rgba(var(--theme-color-rgb), 0.05);
            border-color: var(--theme-color);
            box-shadow: 0 10px 25px rgba(var(--theme-color-rgb), 0.2);
        }

        .link-card .icon-container {
            transition: all 0.5s ease;
        }

        .link-card:hover .icon-container {
            transform: scale(1.1) rotate(5deg);
            background: var(--theme-color);
            box-shadow: 0 0 15px var(--theme-color);
        }

        .link-card:hover .icon-container img {
            filter: brightness(0);
        }

        /* 隐藏滚动条 */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(var(--theme-color-rgb), 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--theme-color); }

        .fade-in {
            animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .search-input {
            background: rgba(0, 0, 0, var(--glass-opacity));
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-input:focus {
            background: rgba(0, 0, 0, calc(var(--glass-opacity) + 0.2));
            border-color: var(--theme-color);
            box-shadow: 0 0 25px rgba(var(--theme-color-rgb), 0.4);
            transform: scale(1.01);
            outline: none;
        }

        #clock-container {
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(var(--theme-color-rgb), 0.5);
        }

        .site-title-themed {
            color: var(--theme-color);
            text-shadow: 0 0 15px rgba(var(--theme-color-rgb), 0.4);
        }

        .site-title-static {
            color: white;
            text-shadow: 0 0 10px rgba(var(--theme-color-rgb), 0.3);
        }

        .keyboard-hint {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 1px 4px;
            border-radius: 4px;
            font-size: 10px;
        }
    </style>
</head>
<body id="body-bg">
    <div id="bg-overlay" class="fixed inset-0 bg-black z-[-1]" style="opacity: 0.5;"></div>
    
    <div class="container mx-auto px-4 py-16 relative z-10 max-w-7xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-20 fade-in">
            <header class="text-center md:text-left mb-8 md:mb-0">
                <h1 id="site-title" class="orbitron text-3xl md:text-4xl font-bold tracking-tighter mb-2 site-title-themed">
                    十夜导航系统
                </h1>
                <p class="theme-text opacity-60 tracking-[0.4em] uppercase text-[9px] md:text-xs">
                    轻量级赛博导航 v1.0
                </p>
            </header>
            
            <div id="clock-container" class="glass px-8 py-4 text-center">
                <div id="clock-time" class="orbitron text-3xl md:text-4xl font-bold theme-text">00:00:00</div>
                <div id="clock-date" class="mono text-[10px] text-gray-500 mt-1 uppercase tracking-widest">2026年5月18日 星期一</div>
            </div>
        </div>

        <!-- 搜索框 -->
        <div class="max-w-2xl mx-auto mb-20 fade-in" style="animation-delay: 0.2s;">
            <div class="relative group">
                <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 group-focus-within:theme-text transition-colors w-5 h-5"></i>
                <input type="text" id="search-input" placeholder="输入关键字或按 / 快速搜索..." 
                    class="search-input w-full py-5 pl-14 pr-20 rounded-2xl glass text-base">
                <div class="absolute right-5 top-1/2 -translate-y-1/2 hidden md:flex items-center space-x-2 text-gray-500 pointer-events-none">
                    <span class="keyboard-hint">/</span>
                    <span class="text-[10px] uppercase font-bold orbitron">搜索</span>
                </div>
            </div>
        </div>

        <div id="loading" class="flex flex-col justify-center items-center h-64 fade-in">
            <div class="loader"></div>
            <p class="mt-4 text-gray-500 text-sm orbitron tracking-widest">正在加载数据库...</p>
        </div>

        <div id="navigation-content" class="space-y-16">
            <!-- 分类内容将由 JS 渲染 -->
        </div>

        <footer class="mt-32 text-center border-t border-white/5 pt-10 pb-10 fade-in">
            <p class="text-gray-600 text-[10px] orbitron tracking-widest uppercase mb-2">为深夜而设计</p>
            <p class="text-gray-500 text-[10px]">&copy; 2026 十夜导航. Power by Cloudflare D1</p>
            <div class="mt-4 flex justify-center space-x-6">
                <a href="/admin.html" class="text-gray-500 hover:theme-text transition-colors text-[10px] uppercase tracking-widest">进入管理控制台</a>
            </div>
        </footer>
    </div>

    <script>
        let allData = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await init();
            updateClock();
            setInterval(updateClock, 1000);
            
            // 搜索监听
            document.getElementById('search-input').addEventListener('input', (e) => {
                filterContent(e.target.value);
            });

            // 快捷键监听
            document.addEventListener('keydown', (e) => {
                if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
                if (e.key === 'Escape') {
                    document.getElementById('search-input').blur();
                }
            });
        });

        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour12: false });
            const dateStr = now.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
            
            document.getElementById('clock-time').innerText = time;
            document.getElementById('clock-date').innerText = dateStr;
        }

        function applyConfig(config) {
            if (config.themeColor) {
                const hex = config.themeColor.replace('#', '');
                const r = parseInt(hex.substring(0, 2), 16);
                const g = parseInt(hex.substring(2, 4), 16);
                const b = parseInt(hex.substring(4, 6), 16);
                document.documentElement.style.setProperty('--theme-color', config.themeColor);
                document.documentElement.style.setProperty('--theme-color-rgb', `${r}, ${g}, ${b}`);
            }
            
            if (config.backgroundUrl) {
                document.getElementById('body-bg').style.backgroundImage = `url('${config.backgroundUrl}')`;
            }
            if (config.backgroundOpacity !== undefined) {
                const bgOp = parseFloat(config.backgroundOpacity);
                document.documentElement.style.setProperty('--bg-opacity', bgOp);
                document.getElementById('bg-overlay').style.opacity = bgOp;
            }
            if (config.cardOpacity !== undefined) {
                document.documentElement.style.setProperty('--glass-opacity', config.cardOpacity);
            }
            if (config.siteName) {
                document.getElementById('site-title').innerText = config.siteName;
                document.title = config.siteName + " | 极简赛博导航";
            }
        }

        async function init() {
            try {
                // 加载配置
                const configRes = await fetch('/api/config');
                const config = await configRes.json();
                applyConfig(config);

                // 加载链接
                const linksRes = await fetch('/api/links');
                allData = await linksRes.json();
                
                render(allData);
            } catch (err) {
                console.error("Initialization Failed:", err);
                document.getElementById('loading').innerHTML = `
                    <div class="text-center p-8 glass border-red-500/20">
                        <p class="text-red-400 font-bold mb-2">数据库初始化错误</p>
                        <p class="text-gray-500 text-xs uppercase tracking-widest">请检查系统配置和网络状态。</p>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function filterContent(query) {
            if (!query) {
                render(allData);
                lucide.createIcons();
                return;
            }
            query = query.toLowerCase();
            const filtered = allData.map(cat => {
                return {
                    ...cat,
                    links: cat.links.filter(link => 
                        link.title.toLowerCase().includes(query) || 
                        link.url.toLowerCase().includes(query)
                    )
                };
            }).filter(cat => cat.links.length > 0);
            
            render(filtered);
            lucide.createIcons();
        }

        function render(categories) {
            const container = document.getElementById('navigation-content');
            container.innerHTML = '';
            document.getElementById('loading').style.display = 'none';

            if (categories.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-24 glass border-white/5 mx-auto max-w-sm fade-in">
                        <i data-lucide="shield-alert" class="w-12 h-12 text-gray-600 mx-auto mb-4"></i>
                        <div class="text-gray-500 orbitron tracking-[0.3em] uppercase text-xs">
                            未发现结果
                        </div>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            categories.forEach((cat, index) => {
                const section = document.createElement('section');
                section.className = 'category-section fade-in';
                section.style.animationDelay = `${index * 0.1}s`;

                const titleHtml = `
                    <div class="flex items-center mb-8 px-2">
                        <div class="flex items-center space-x-3">
                             <div class="w-1 h-4 theme-bg theme-glow"></div>
                             <h2 class="text-sm font-bold tracking-[0.4em] theme-text uppercase orbitron">${cat.name}</h2>
                        </div>
                        <div class="flex-grow ml-6 h-[1px] bg-gradient-to-r from-white/10 to-transparent"></div>
                        <span class="ml-4 text-[10px] mono theme-text opacity-40 uppercase tracking-widest">${cat.links.length} 个单元</span>
                    </div>
                `;

                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4';

                cat.links.forEach((link, lIndex) => {
                    const card = document.createElement('a');
                    card.href = link.url;
                    card.target = '_blank';
                    card.className = 'link-card glass p-4 flex flex-col items-center text-center group h-full cursor-pointer';
                    
                    const iconUrl = link.icon || `https://www.google.com/s2/favicons?sz=64&domain=${new URL(link.url).hostname}`;
                    
                    card.innerHTML = `
                        <div class="icon-container w-14 h-14 rounded-2xl bg-black/40 flex items-center justify-center overflow-hidden mb-4 border border-white/5 transition-all shadow-inner">
                            <img src="${iconUrl}" alt="${link.title}" class="w-8 h-8 object-contain opacity-70 group-hover:opacity-100 transition-opacity" onerror="this.src='https://favicon.png.pub/v1/${new URL(link.url).hostname}'">
                        </div>
                <h3 class="text-sm font-bold theme-text transition-colors uppercase orbitron tracking-wider truncate">${link.title}</h3>
                <p class="text-[10px] theme-text opacity-40 truncate mt-1 group-hover:opacity-100 mono group-hover:text-white transition-all">${new URL(link.url).hostname.replace('www.', '')}</p>
                    `;
                    grid.appendChild(card);
                });

                section.innerHTML = titleHtml;
                section.appendChild(grid);
                container.appendChild(section);
            });
        }
    </script>
</body>
</html>
